spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/heimdall_dev
    username: heimdall_dev
    password: heimdall_dev
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

grpc:
  server:
    port: ${GRPC_PORT:9091}

logging:
  level:
    root: INFO
    com.heimdall: DEBUG
    org.springframework.web: DEBUG
    org.springframework.kafka: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
