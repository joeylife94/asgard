name: v1.1 M4 Bifrost Restart Proof

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/v11-m4-bifrost-restart.yml'
      - 'bifrost/**'
      - 'heimdall/**'
      - 'docker-compose.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  restart-proof:
    name: M4 persisted job survives Bifrost restart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAFKA_ENABLED: 'true'
      HEIMDALL_ENABLED: 'true'
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      HEIMDALL_DATABASE_URL: postgresql://asgard:asgard_password@127.0.0.1:5432/heimdall
      BIFROST_OLLAMA_URL: http://127.0.0.1:11434
      BIFROST_OLLAMA_MODEL: smollm:135m
      BIFROST_OLLAMA_ALLOW_FALLBACK: 'false'
      BIFROST_OLLAMA_NUM_PREDICT: '256'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare applications
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :heimdall:bootJar --no-daemon --console=plain
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r bifrost/requirements.txt
          python -m pip install -e bifrost

      - name: Start infrastructure
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres zookeeper kafka redis elasticsearch
          for attempt in {1..30}; do
            docker compose exec -T postgres pg_isready -U asgard >/dev/null 2>&1 && break
            test "$attempt" -lt 30 || { docker compose logs postgres; exit 1; }
            sleep 2
          done
          for attempt in {1..45}; do
            docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1 && break
            test "$attempt" -lt 45 || { docker compose logs kafka zookeeper; exit 1; }
            sleep 2
          done

      - name: Start real Ollama
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name m4-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:11434/api/tags > m4-ollama-tags.json && break
            test "$attempt" -lt 30 || { docker logs m4-ollama; exit 1; }
            sleep 2
          done
          docker exec m4-ollama ollama pull smollm:135m | tee m4-ollama-pull.log
          curl --fail --silent http://127.0.0.1:11434/api/tags | grep -q 'smollm:135m'

      - name: Start Heimdall
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/heimdall
          SPRING_DATASOURCE_USERNAME: asgard
          SPRING_DATASOURCE_PASSWORD: asgard_password
          SPRING_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          JWT_SECRET: m4-ci-jwt-secret-at-least-32-bytes-long
          HEIMDALL_SECURITY_ADMIN_USERNAME: m4-operator
          HEIMDALL_SECURITY_ADMIN_PASSWORD: m4-operator-password
          HEIMDALL_SECURITY_ADMIN_ROLES: ADMIN,USER
          HEIMDALL_ANALYSIS_AUTO_REQUEST: 'false'
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: redis_password
          GRPC_PORT: '9091'
        run: |
          set -euo pipefail
          HEIMDALL_JAR=$(find heimdall/build/libs -maxdepth 1 -name 'heimdall-*.jar' -type f | head -n 1)
          java -jar "$HEIMDALL_JAR" > m4-heimdall.log 2>&1 & echo $! > m4-heimdall.pid
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:8080/actuator/health > m4-heimdall-health.json && break
            test "$attempt" -lt 90 || { cat m4-heimdall.log; exit 1; }
            sleep 2
          done

      - name: Create persisted target job
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"username":"m4-operator","password":"m4-operator-password"}' \
            http://127.0.0.1:8080/api/v1/auth/login > m4-login.json
          TOKEN=$(python -c "import json; print(json.load(open('m4-login.json'))['token'])")
          printf '%s' "$TOKEN" > m4-token.txt
          cat > m4-input.json <<'JSON'
          {"source":"m4-restart-proof","serviceName":"restart-proof-service","environment":"proof","severity":"ERROR","logContent":"2026-09-01T00:00:00Z ERROR restart-proof-service deterministic synthetic worker restart proof","metadata":{"proof":"m4","synthetic":true}}
          JSON
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data @m4-input.json http://127.0.0.1:8080/api/v1/logs > m4-ingest.json
          LOG_ID=$(python -c "import json; print(json.load(open('m4-ingest.json'))['logId'])")
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: m4-restart-v1' -H 'X-Trace-Id: m4-restart-trace' \
            -d '{"idempotencyKey":"m4-restart-v1","modelPolicy":{"source":"local"}}' \
            -X POST http://127.0.0.1:8080/api/v1/logs/$LOG_ID/analysis > m4-accepted.json
          JOB_ID=$(python -c "import json; print(json.load(open('m4-accepted.json'))['jobId'])")
          echo "$JOB_ID" > m4-job-id.txt
          curl --fail --silent -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8080/api/v1/analysis/jobs/$JOB_ID > m4-pre-interruption-job.json

      - name: Start Bifrost and kill during processing
        shell: bash
        run: |
          set -euo pipefail
          python -m bifrost.main serve > m4-bifrost-first.log 2>&1 & echo $! > m4-bifrost-first.pid
          PID=$(cat m4-bifrost-first.pid)
          for attempt in {1..90}; do
            grep -q 'Processing analysis request' m4-bifrost-first.log && break
            test "$attempt" -lt 90 || { cat m4-bifrost-first.log; exit 1; }
            sleep 1
          done
          grep 'Processing analysis request' m4-bifrost-first.log > m4-first-processing-evidence.txt
          kill -9 "$PID"
          wait "$PID" 2>/dev/null || true
          printf 'pid=%s\nkill=SIGKILL\n' "$PID" > m4-restart-event.txt
          ! grep -q 'Analysis request processed successfully' m4-bifrost-first.log

      - name: Restart Bifrost and await persisted success
        shell: bash
        run: |
          set -euo pipefail
          python -m bifrost.main serve > m4-bifrost-second.log 2>&1 & echo $! > m4-bifrost-second.pid
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && break
            test "$attempt" -lt 90 || { cat m4-bifrost-second.log; exit 1; }
            sleep 2
          done
          TOKEN=$(cat m4-token.txt)
          JOB_ID=$(cat m4-job-id.txt)
          for attempt in {1..180}; do
            curl --fail --silent -H "Authorization: Bearer $TOKEN" \
              http://127.0.0.1:8080/api/v1/analysis/jobs/$JOB_ID > m4-final-job.json
            STATUS=$(python -c "import json; print(json.load(open('m4-final-job.json'))['status'])")
            [ "$STATUS" = 'SUCCEEDED' ] && break
            sleep 2
          done
          python - <<'PY'
          import json
          pre=json.load(open('m4-pre-interruption-job.json'))
          final=json.load(open('m4-final-job.json'))
          assert final['status']=='SUCCEEDED', final
          assert final.get('analysisId') is not None, final
          evidence={
            'status':'PASS',
            'jobId':final.get('jobId') or final.get('id'),
            'preInterruptionStatus':pre.get('status'),
            'finalStatus':final.get('status'),
            'analysisId':final.get('analysisId'),
            'firstProcessObserved':True,
            'firstProcessKilledBeforeSuccessLog':True,
            'replayedAfterRestart':True,
            'finalPersistedResultVisible':True,
            'synthetic':True,
            'cloudExecution':False,
            'limitations':['single-node bounded SIGKILL/restart proof only','no HA/SLA/SLO claim','no Kafka outage or multi-node failover'],
          }
          json.dump(evidence, open('m4-evidence.json','w'), indent=2)
          PY
          grep -q 'Processing analysis request' m4-bifrost-second.log
          grep -q 'Analysis request processed successfully' m4-bifrost-second.log

      - name: Verify evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          e=json.load(open('m4-evidence.json'))
          assert e['status']=='PASS'
          assert e['finalStatus']=='SUCCEEDED'
          assert e['firstProcessKilledBeforeSuccessLog'] is True
          assert e['replayedAfterRestart'] is True
          assert e['synthetic'] is True and e['cloudExecution'] is False
          PY
          ! grep -R -E 'AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|Bearer [A-Za-z0-9._-]{20,}' m4-evidence.json m4-*.txt 2>/dev/null

      - name: Upload M4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-m4-bifrost-restart-evidence
          if-no-files-found: warn
          path: |
            m4-evidence.json
            m4-pre-interruption-job.json
            m4-final-job.json
            m4-restart-event.txt
            m4-first-processing-evidence.txt
            m4-bifrost-first.log
            m4-bifrost-second.log
