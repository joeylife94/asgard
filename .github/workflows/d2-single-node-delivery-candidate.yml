name: D2 Single-node Delivery Candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify delivery contract
        run: bash scripts/check-d2-delivery-candidate.sh
      - name: Verify handoff truth contract
        run: bash scripts/check-single-node-handoff-truth.sh
      - name: Assemble exact-head candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '\r\n' < delivery/single-node-candidate/VERSION)"
          OUT="dist/$VERSION"
          mkdir -p "$OUT"

          # The delivery candidate is a provenance-matched tracked repository
          # snapshot, not a loose collection of helper scripts. Package the
          # exact commit tree so D2 provenance and the accepted D3 pilot surface
          # remain one coherent handoff artifact.
          git archive "$GITHUB_SHA" | tar -x -C "$OUT"
          printf 'version=%s\ncommit=%s\nrepository=%s\n' "$VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" > "$OUT/PROVENANCE.txt"

          test "$(sed -n 's/^commit=//p' "$OUT/PROVENANCE.txt")" = "$GITHUB_SHA"
          tar -C dist -czf "dist/$VERSION.tar.gz" "$VERSION"
          printf 'artifact_name=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - name: Verify assembled bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="dist/$artifact_name"
          ARCHIVE="dist/$artifact_name.tar.gz"
          LISTING="dist/$artifact_name.contents.txt"

          test -s "$ROOT/PROVENANCE.txt"
          grep -Fxq "commit=$GITHUB_SHA" "$ROOT/PROVENANCE.txt"
          grep -Fq 'Production readiness is not verified.' "$ROOT/delivery/single-node-candidate/MANIFEST.md"
          grep -Fq 'Cloud-provider execution is not verified.' "$ROOT/delivery/single-node-candidate/MANIFEST.md"
          grep -Fq 'Version upgrade/rollback is not verified.' "$ROOT/delivery/single-node-candidate/MANIFEST.md"
          grep -Fq 'bash scripts/pilot.sh start' "$ROOT/delivery/single-node-candidate/MANIFEST.md"
          grep -Fq 'persistence-preserving' "$ROOT/docs/SINGLE_NODE_HANDOFF.md"

          # Executable mode is not part of the accepted contract; repository
          # scripts are invoked explicitly via bash. Verify tracked inputs exist
          # and have valid shell syntax instead.
          test -s "$ROOT/gradlew"
          test -s "$ROOT/docker-compose.yml"
          test -s "$ROOT/bifrost/requirements.txt"
          test -d "$ROOT/heimdall"
          test -d "$ROOT/bifrost"
          test -s "$ROOT/scripts/pilot.sh"
          test -s "$ROOT/scripts/local-proof.sh"
          test -s "$ROOT/scripts/cleanup-retained-proof.sh"
          bash -n "$ROOT/gradlew"
          bash -n "$ROOT/scripts/pilot.sh"
          bash -n "$ROOT/scripts/local-proof.sh"
          bash -n "$ROOT/scripts/operator-diagnostic-snapshot.sh"
          bash -n "$ROOT/scripts/m6-backup-restore-proof.sh"
          bash -n "$ROOT/scripts/cleanup-retained-proof.sh"

          tar -tzf "$ARCHIVE" > "$LISTING"
          grep -Fxq "$artifact_name/gradlew" "$LISTING"
          grep -Fxq "$artifact_name/docker-compose.yml" "$LISTING"
          grep -Fxq "$artifact_name/scripts/pilot.sh" "$LISTING"
          grep -Fxq "$artifact_name/scripts/local-proof.sh" "$LISTING"
          grep -Fxq "$artifact_name/scripts/cleanup-retained-proof.sh" "$LISTING"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: dist/${{ env.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14
