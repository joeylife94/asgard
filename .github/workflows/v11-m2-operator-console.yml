name: v1.1 M2 Operator Console

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/v11-m2-operator-console.yml'
      - 'bifrost/frontend/**'
      - 'heimdall/src/main/java/com/heimdall/controller/AnalysisJobController.java'
      - 'heimdall/src/main/java/com/heimdall/service/AnalysisJobService.java'
      - 'heimdall/src/main/java/com/heimdall/repository/AnalysisJobRepository.java'
      - 'docker-compose.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  operator-console:
    name: M2 read-only persisted job lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      M2_OPERATOR_USERNAME: m2-operator
      M2_OPERATOR_PASSWORD: m2-operator-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare application and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :heimdall:bootJar --no-daemon --console=plain
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r bifrost/requirements.txt
          python -m pip install -e bifrost
          cd bifrost/frontend
          npm install
          npm run build
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start required infrastructure
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres zookeeper kafka redis elasticsearch

          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U asgard >/dev/null 2>&1; then
              echo "PostgreSQL ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..45}; do
            if docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1; then
              echo "Kafka ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose logs kafka zookeeper
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9200/_cluster/health > m2-elasticsearch.json; then
              echo "Elasticsearch ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs elasticsearch
              exit 1
            fi
            sleep 2
          done

      - name: Start real Ollama model
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name m2-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > m2-ollama-tags-before.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs m2-ollama
              exit 1
            fi
            sleep 2
          done
          docker exec m2-ollama ollama pull smollm:135m | tee m2-ollama-pull.log
          curl --fail --silent http://127.0.0.1:11434/api/tags > m2-ollama-tags-after.json
          grep -q 'smollm:135m' m2-ollama-tags-after.json

      - name: Start Heimdall and Bifrost
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/heimdall
          SPRING_DATASOURCE_USERNAME: asgard
          SPRING_DATASOURCE_PASSWORD: asgard_password
          SPRING_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          JWT_SECRET: m2-ci-jwt-secret-at-least-32-bytes-long
          HEIMDALL_SECURITY_ADMIN_USERNAME: m2-operator
          HEIMDALL_SECURITY_ADMIN_PASSWORD: m2-operator-password
          HEIMDALL_SECURITY_ADMIN_ROLES: ADMIN,USER
          HEIMDALL_ANALYSIS_AUTO_REQUEST: 'false'
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: redis_password
          GRPC_PORT: '9091'
          KAFKA_ENABLED: 'true'
          HEIMDALL_ENABLED: 'true'
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          HEIMDALL_DATABASE_URL: postgresql://asgard:asgard_password@127.0.0.1:5432/heimdall
          BIFROST_OLLAMA_URL: http://127.0.0.1:11434
          BIFROST_OLLAMA_MODEL: smollm:135m
          BIFROST_OLLAMA_ALLOW_FALLBACK: 'false'
          BIFROST_OLLAMA_NUM_PREDICT: '256'
        run: |
          set -euo pipefail
          HEIMDALL_JAR=$(find heimdall/build/libs -maxdepth 1 -name 'heimdall-*.jar' -type f | head -n 1)
          test -n "$HEIMDALL_JAR"

          java -jar "$HEIMDALL_JAR" > m2-heimdall.log 2>&1 &
          echo $! > m2-heimdall.pid
          python -m bifrost.main serve > m2-bifrost.log 2>&1 &
          echo $! > m2-bifrost.pid

          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > m2-heimdall-health.json; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              cat m2-heimdall.log
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health > m2-bifrost-health.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat m2-bifrost.log
              exit 1
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          health = json.load(open('m2-bifrost-health.json'))
          assert health['components']['ollama'] == 'ok', health
          assert health['components']['kafka'] == 'enabled', health
          assert health['components']['heimdall_integration'] == 'enabled', health
          PY

      - name: Seed one real successful persisted job
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"username":"m2-operator","password":"m2-operator-password"}' \
            http://127.0.0.1:8080/api/v1/auth/login > m2-login.json

          TOKEN=$(python - <<'PY'
          import json
          print(json.load(open('m2-login.json'))['token'])
          PY
          )
          test -n "$TOKEN"
          printf '%s' "$TOKEN" > m2-token.txt

          cat > m2-success-input.json <<'JSON'
          {
            "source": "m2-operator-console-proof",
            "serviceName": "operator-console-service",
            "environment": "proof",
            "severity": "ERROR",
            "logContent": "2026-08-31T14:00:00Z ERROR operator-console-service upstream timeout synthetic=m2-success",
            "metadata": {"proof": "m2", "case": "success", "synthetic": true}
          }
          JSON

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data @m2-success-input.json \
            http://127.0.0.1:8080/api/v1/logs > m2-success-ingest.json

          LOG_ID=$(python - <<'PY'
          import json
          print(json.load(open('m2-success-ingest.json'))['logId'])
          PY
          )

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: m2-success-v1' \
            -d '{"idempotencyKey":"m2-success-v1","modelPolicy":{"source":"local"}}' \
            -X POST http://127.0.0.1:8080/api/v1/logs/$LOG_ID/analysis > m2-success-accepted.json

          SUCCESS_JOB_ID=$(python - <<'PY'
          import json
          print(json.load(open('m2-success-accepted.json'))['jobId'])
          PY
          )
          echo "$SUCCESS_JOB_ID" > m2-success-job-id.txt

          final_status=''
          for attempt in {1..180}; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $TOKEN" \
              http://127.0.0.1:8080/api/v1/analysis/jobs/$SUCCESS_JOB_ID > m2-success-job.json
            final_status=$(python - <<'PY'
          import json
          print(json.load(open('m2-success-job.json'))['status'])
          PY
            )
            echo "Success job attempt $attempt: $final_status"
            if [ "$final_status" = 'SUCCEEDED' ]; then break; fi
            if [ "$final_status" = 'FAILED' ]; then
              cat m2-success-job.json
              exit 1
            fi
            sleep 2
          done
          test "$final_status" = 'SUCCEEDED'

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8080/api/v1/logs/$LOG_ID/analysis > m2-success-result.json

          python - <<'PY'
          import json
          job = json.load(open('m2-success-job.json'))
          result = json.load(open('m2-success-result.json'))
          assert job['status'] == 'SUCCEEDED', job
          assert (job.get('resultSummary') or '').strip(), job
          assert result.get('analysisId') is not None, result
          assert 'smollm' in (result.get('model') or '').lower(), result
          PY

      - name: Seed one deterministic persisted failed job
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat m2-token.txt)

          kill "$(cat m2-bifrost.pid)"
          wait "$(cat m2-bifrost.pid)" 2>/dev/null || true
          sleep 3

          cat > m2-failed-input.json <<'JSON'
          {
            "source": "m2-operator-console-proof",
            "serviceName": "operator-console-service",
            "environment": "proof",
            "severity": "ERROR",
            "logContent": "2026-08-31T14:01:00Z ERROR operator-console-service deterministic synthetic failure seed",
            "metadata": {"proof": "m2", "case": "failed", "synthetic": true}
          }
          JSON

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data @m2-failed-input.json \
            http://127.0.0.1:8080/api/v1/logs > m2-failed-ingest.json

          LOG_ID=$(python - <<'PY'
          import json
          print(json.load(open('m2-failed-ingest.json'))['logId'])
          PY
          )

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: m2-failed-v1' \
            -H 'X-Trace-Id: m2-failed-initial-trace' \
            -d '{"idempotencyKey":"m2-failed-v1","modelPolicy":{"source":"local"}}' \
            -X POST http://127.0.0.1:8080/api/v1/logs/$LOG_ID/analysis > m2-failed-accepted.json

          FAILED_JOB_ID=$(python - <<'PY'
          import json
          print(json.load(open('m2-failed-accepted.json'))['jobId'])
          PY
          )
          echo "$FAILED_JOB_ID" > m2-failed-job-id.txt

          docker compose exec -T kafka kafka-console-consumer \
            --bootstrap-server kafka:29092 \
            --topic analysis.request \
            --group bifrost-consumer-group \
            --timeout-ms 10000 \
            --max-messages 1 > m2-failed-request-drained.txt 2>&1

          python - <<'PY' > m2-dlq-event.json
          import json
          job_id = open('m2-failed-job-id.txt').read().strip()
          print(json.dumps({
              'schema_version': 1,
              'job_id': job_id,
              'idempotency_key': 'm2-failed-v1',
              'error_code': 'M2_DETERMINISTIC_FAILURE',
              'error_message': 'Deterministic M2 failure injected through existing dlq.failed contract',
              'trace_id': 'm2-failed-trace',
              'original_topic': 'analysis.request',
              'original_partition': 0,
              'original_offset': 0,
              'payload': {'proof': 'm2', 'synthetic': True},
          }))
          PY

          printf '%s:%s\n' "$FAILED_JOB_ID" "$(cat m2-dlq-event.json)" | \
            docker compose exec -T kafka kafka-console-producer \
              --bootstrap-server kafka:29092 \
              --topic dlq.failed \
              --property parse.key=true \
              --property key.separator=:

          final_status=''
          for attempt in {1..30}; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $TOKEN" \
              http://127.0.0.1:8080/api/v1/analysis/jobs/$FAILED_JOB_ID > m2-failed-job.json
            final_status=$(python - <<'PY'
          import json
          print(json.load(open('m2-failed-job.json'))['status'])
          PY
            )
            echo "Failed job attempt $attempt: $final_status"
            if [ "$final_status" = 'FAILED' ]; then break; fi
            sleep 2
          done
          test "$final_status" = 'FAILED'

          python - <<'PY'
          import json
          job = json.load(open('m2-failed-job.json'))
          assert job['status'] == 'FAILED', job
          assert job['errorCode'] == 'M2_DETERMINISTIC_FAILURE', job
          assert job['traceId'] == 'm2-failed-trace', job
          PY

      - name: Verify recent-job read API against real persistence
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat m2-token.txt)
          SUCCESS_JOB_ID=$(cat m2-success-job-id.txt)
          FAILED_JOB_ID=$(cat m2-failed-job-id.txt)

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8080/api/v1/analysis/jobs?page=0&size=20' > m2-jobs-page.json

          python - <<'PY'
          import json
          success_id = open('m2-success-job-id.txt').read().strip()
          failed_id = open('m2-failed-job-id.txt').read().strip()
          page = json.load(open('m2-jobs-page.json'))
          jobs = page.get('content', [])
          by_id = {str(job['jobId']): job for job in jobs}
          assert success_id in by_id, page
          assert failed_id in by_id, page
          assert by_id[success_id]['status'] == 'SUCCEEDED', by_id[success_id]
          assert (by_id[success_id].get('resultSummary') or '').strip(), by_id[success_id]
          assert by_id[failed_id]['status'] == 'FAILED', by_id[failed_id]
          assert by_id[failed_id]['errorCode'] == 'M2_DETERMINISTIC_FAILURE', by_id[failed_id]
          evidence = {
              'status': 'PASS',
              'synthetic': True,
              'jobCountVisible': len(jobs),
              'successJobId': success_id,
              'successStatus': by_id[success_id]['status'],
              'failedJobId': failed_id,
              'failedStatus': by_id[failed_id]['status'],
              'failedErrorCode': by_id[failed_id]['errorCode'],
          }
          with open('m2-api-evidence.json', 'w', encoding='utf-8') as f:
              json.dump(evidence, f, indent=2)
          print(json.dumps(evidence))
          PY

      - name: Start frontend operator console
        shell: bash
        run: |
          set -euo pipefail
          cd bifrost/frontend
          VITE_HEIMDALL_API_URL=http://localhost:8080 npm run dev -- --host 0.0.0.0 --port 3000 > ../../m2-frontend.log 2>&1 &
          echo $! > ../../m2-frontend.pid
          cd ../..

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000 > m2-frontend-root.html; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat m2-frontend.log
              exit 1
            fi
            sleep 2
          done

      - name: Execute browser list/detail proof
        shell: bash
        run: |
          set -euo pipefail
          cd bifrost/frontend
          npx playwright test e2e/operator-console.spec.js --reporter=line --workers=1

      - name: Upload M2 synthetic-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-m2-operator-console-evidence
          path: |
            m2-api-evidence.json
            bifrost/frontend/m2-browser-evidence.json
            bifrost/frontend/m2-success-job.png
            bifrost/frontend/m2-failed-job.png
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f m2-frontend.pid ]; then kill "$(cat m2-frontend.pid)" 2>/dev/null || true; fi
          if [ -f m2-bifrost.pid ]; then kill "$(cat m2-bifrost.pid)" 2>/dev/null || true; fi
          if [ -f m2-heimdall.pid ]; then kill "$(cat m2-heimdall.pid)" 2>/dev/null || true; fi
          docker rm -f m2-ollama >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans >/dev/null 2>&1 || true
