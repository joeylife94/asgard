name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  preflight:
    name: Phase 0 preflight (runtime + frontend build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture runtime versions
        shell: bash
        run: |
          set -o pipefail
          {
            git status --short --branch
            git rev-parse HEAD
            java -version
            python --version
            node --version
            npm --version
            docker --version
          } 2>&1 | tee phase0-runtime.txt

      - name: Verify frontend install and build contract
        working-directory: bifrost/frontend
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee phase0-npm-install.log
          npm run build 2>&1 | tee phase0-frontend-build.log

      - name: Upload Phase 0 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-preflight-evidence
          path: |
            phase0-runtime.txt
            bifrost/frontend/phase0-npm-install.log
            bifrost/frontend/phase0-frontend-build.log
          if-no-files-found: ignore
          retention-days: 14

  uc01_frontend_dev:
    name: UC-01 frontend dev root reachability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: bifrost/frontend
        run: npm install --no-audit --no-fund

      - name: Start dev server and verify root
        working-directory: bifrost/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > p0-b3-vite-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ -o p0-b3-root.html; then
              echo "Frontend root reachable on attempt $attempt"
              exit 0
            fi
            sleep 1
          done

          echo "Frontend root did not become reachable"
          cat p0-b3-vite-dev.log
          exit 1

      - name: Upload UC-01 frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-b3-frontend-dev-evidence
          path: |
            bifrost/frontend/p0-b3-vite-dev.log
            bifrost/frontend/p0-b3-root.html
          if-no-files-found: ignore
          retention-days: 14

  uc01_default_build:
    name: UC-01 default build path (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute default repository build path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          .\build-all.ps1 -SkipTests *>&1 | Tee-Object -FilePath p0-b3-build-all.log
          $buildExit = $LASTEXITCODE
          $frontendReached = Select-String -Path p0-b3-build-all.log -Pattern 'Frontend build completed successfully' -Quiet
          if (-not $frontendReached) {
            Write-Error 'Default build path did not reach a successful frontend build step.'
            exit 1
          }
          if ($buildExit -ne 0) {
            exit $buildExit
          }

      - name: Upload UC-01 default-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-b3-default-build-evidence
          path: p0-b3-build-all.log
          if-no-files-found: ignore
          retention-days: 14

  uc01_core_health:
    name: UC-01 full core-service startup and health
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare application artifacts and dependencies
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :heimdall:bootJar --no-daemon --console=plain
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r bifrost/requirements.txt
          python -m pip install -e bifrost
          npm --prefix bifrost/frontend install --no-audit --no-fund

      - name: Start required infrastructure and prove readiness
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres zookeeper kafka redis elasticsearch prometheus grafana
          docker compose ps | tee p0-b4-compose-ps.txt

          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U asgard >/dev/null 2>&1; then
              echo "PostgreSQL ready on attempt $attempt" | tee p0-b4-postgres.txt
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..45}; do
            if docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1; then
              echo "Kafka ready on attempt $attempt" | tee p0-b4-kafka.txt
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose logs kafka zookeeper
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if docker compose exec -T redis redis-cli -a redis_password ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready on attempt $attempt" | tee p0-b4-redis.txt
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs redis
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:9200/_cluster/health -o p0-b4-elasticsearch.json; then
              echo "Elasticsearch reachable on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs elasticsearch
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:9090/-/ready -o p0-b4-prometheus.txt; then
              echo "Prometheus reachable on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs prometheus
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/health -o p0-b4-grafana.json; then
              echo "Grafana reachable on host port 3001 on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs grafana
              exit 1
            fi
            sleep 2
          done

      - name: Start Heimdall, Bifrost, and Frontend
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/heimdall
          SPRING_DATASOURCE_USERNAME: asgard
          SPRING_DATASOURCE_PASSWORD: asgard_password
          SPRING_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          JWT_SECRET: p0-b4-ci-jwt-secret-at-least-32-bytes-long
          HEIMDALL_SECURITY_ADMIN_USERNAME: admin
          HEIMDALL_SECURITY_ADMIN_PASSWORD: p0-b4-admin-password
          HEIMDALL_SECURITY_ADMIN_ROLES: ADMIN,USER
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: redis_password
        run: |
          set -euo pipefail
          HEIMDALL_JAR=$(find heimdall/build/libs -maxdepth 1 -name 'heimdall-*.jar' -type f | head -n 1)
          test -n "$HEIMDALL_JAR"
          java -jar "$HEIMDALL_JAR" > p0-b4-heimdall.log 2>&1 &
          echo $! > p0-b4-heimdall.pid

          python -m bifrost.main serve > p0-b4-bifrost.log 2>&1 &
          echo $! > p0-b4-bifrost.pid

          (cd bifrost/frontend && npm run dev -- --host 127.0.0.1 > ../../p0-b4-frontend.log 2>&1) &
          echo $! > p0-b4-frontend.pid

      - name: Verify application reachability
        shell: bash
        run: |
          set -euo pipefail

          wait_http() {
            local name="$1"
            local url="$2"
            local output="$3"
            for attempt in {1..60}; do
              if curl --fail --silent --show-error "$url" -o "$output"; then
                echo "$name reachable on attempt $attempt"
                return 0
              fi
              sleep 2
            done
            echo "$name did not become reachable at $url"
            return 1
          }

          wait_http "Heimdall" "http://127.0.0.1:8080/actuator/health" "p0-b4-heimdall-health.json" || {
            cat p0-b4-heimdall.log
            exit 1
          }
          wait_http "Bifrost" "http://127.0.0.1:8000/health" "p0-b4-bifrost-health.json" || {
            cat p0-b4-bifrost.log
            exit 1
          }
          wait_http "Frontend" "http://127.0.0.1:3000/" "p0-b4-frontend-root.html" || {
            cat p0-b4-frontend.log
            exit 1
          }

          docker compose ps | tee p0-b4-compose-ps-final.txt

      - name: Upload UC-01 core-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-b4-core-health-evidence
          path: |
            p0-b4-*.txt
            p0-b4-*.json
            p0-b4-*.html
            p0-b4-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down UC-01 stack
        if: always()
        shell: bash
        run: |
          for pid_file in p0-b4-heimdall.pid p0-b4-bifrost.pid p0-b4-frontend.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          docker compose down -v --remove-orphans || true

  unit:
    name: Unit tests (Heimdall + Bifrost)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Heimdall unit tests (exclude integration)
        run: |
          chmod +x gradlew
          ./gradlew :heimdall:test -Dtest.excludeTags=integration --no-daemon --console=plain

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bifrost deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r bifrost/requirements.txt
          python -m pip install -e bifrost

      - name: Run Bifrost unit tests (skip integration)
        working-directory: bifrost
        run: |
          python -m pytest -q -m "not integration"

  integration:
    name: Integration tests (manual/optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: asgard
          POSTGRES_PASSWORD: asgard_password
          POSTGRES_DB: heimdall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asgard" --health-interval 10s --health-timeout 5s --health-retries 5
      zookeeper:
        image: confluentinc/cp-zookeeper:7.0.1
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports:
          - 2181:2181
      kafka:
        image: confluentinc/cp-kafka:7.0.1
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/9092 || exit 1'" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Wait for services
        run: |
          echo "Waiting for Postgres and Kafka to become healthy..."
          sleep 20

      - name: Install Bifrost deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r bifrost/requirements.txt
          python -m pip install -e bifrost

      - name: Run integration tests
        working-directory: bifrost
        run: |
          python -m pytest -q -m integration