name: v1.1 M8 Kafka Restart Recovery

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/v11-m8-kafka-restart.yml'
      - 'heimdall/**'
      - 'bifrost/**'
      - 'docker-compose.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kafka-restart-proof:
    name: M8 persisted request survives Kafka restart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAFKA_ENABLED: 'true'
      HEIMDALL_ENABLED: 'true'
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      HEIMDALL_DATABASE_URL: postgresql://asgard:asgard_password@127.0.0.1:5432/heimdall
      BIFROST_OLLAMA_URL: http://127.0.0.1:11434
      BIFROST_OLLAMA_MODEL: smollm:135m
      BIFROST_OLLAMA_ALLOW_FALLBACK: 'false'
      BIFROST_OLLAMA_NUM_PREDICT: '256'

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare applications
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :heimdall:bootJar --no-daemon --console=plain
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r bifrost/requirements.txt
          python -m pip install -e bifrost

      - name: Start proof-owned infrastructure
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres zookeeper kafka redis elasticsearch
          for attempt in {1..30}; do
            docker compose exec -T postgres pg_isready -U asgard >/dev/null 2>&1 && break
            test "$attempt" -lt 30 || { docker compose logs postgres; exit 1; }
            sleep 2
          done
          for attempt in {1..45}; do
            docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1 && break
            test "$attempt" -lt 45 || { docker compose logs kafka zookeeper; exit 1; }
            sleep 2
          done

      - name: Start real Ollama
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name m8-ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:11434/api/tags > m8-ollama-tags.json && break
            test "$attempt" -lt 30 || { docker logs m8-ollama; exit 1; }
            sleep 2
          done
          docker exec m8-ollama ollama pull smollm:135m | tee m8-ollama-pull.log
          curl --fail --silent http://127.0.0.1:11434/api/tags | grep -q 'smollm:135m'

      - name: Start Heimdall without Bifrost consumer
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/heimdall
          SPRING_DATASOURCE_USERNAME: asgard
          SPRING_DATASOURCE_PASSWORD: asgard_password
          SPRING_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          JWT_SECRET: m8-ci-jwt-secret-at-least-32-bytes-long
          HEIMDALL_SECURITY_ADMIN_USERNAME: m8-operator
          HEIMDALL_SECURITY_ADMIN_PASSWORD: m8-operator-password
          HEIMDALL_SECURITY_ADMIN_ROLES: ADMIN,USER
          HEIMDALL_ANALYSIS_AUTO_REQUEST: 'false'
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: redis_password
          GRPC_PORT: '9091'
        run: |
          set -euo pipefail
          HEIMDALL_JAR=$(find heimdall/build/libs -maxdepth 1 -name 'heimdall-*.jar' -type f | head -n 1)
          java -jar "$HEIMDALL_JAR" > m8-heimdall.log 2>&1 & echo $! > m8-heimdall.pid
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:8080/actuator/health > m8-heimdall-health.json && break
            test "$attempt" -lt 90 || { cat m8-heimdall.log; exit 1; }
            sleep 2
          done

      - name: Publish one persisted target Job before Kafka interruption
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"username":"m8-operator","password":"m8-operator-password"}' \
            http://127.0.0.1:8080/api/v1/auth/login > m8-login.json
          TOKEN=$(python -c "import json; print(json.load(open('m8-login.json'))['token'])")
          printf '%s' "$TOKEN" > m8-token.txt
          cat > m8-input.json <<'JSON'
          {"source":"m8-kafka-restart-proof","serviceName":"kafka-restart-proof-service","environment":"proof","severity":"ERROR","logContent":"2026-09-03T00:00:00Z ERROR deterministic synthetic Kafka restart proof","metadata":{"proof":"m8","synthetic":true}}
          JSON
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data @m8-input.json http://127.0.0.1:8080/api/v1/logs > m8-ingest.json
          LOG_ID=$(python -c "import json; print(json.load(open('m8-ingest.json'))['logId'])")
          printf '%s' "$LOG_ID" > m8-log-id.txt
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: m8-kafka-restart-v1' -H 'X-Trace-Id: m8-kafka-restart-trace' \
            -d '{"idempotencyKey":"m8-kafka-restart-v1","modelPolicy":{"source":"local"}}' \
            -X POST "http://127.0.0.1:8080/api/v1/logs/$LOG_ID/analysis" > m8-accepted.json
          JOB_ID=$(python -c "import json; print(json.load(open('m8-accepted.json'))['jobId'])")
          printf '%s' "$JOB_ID" > m8-job-id.txt
          curl --fail --silent -H "Authorization: Bearer $TOKEN" \
            "http://127.0.0.1:8080/api/v1/analysis/jobs/$JOB_ID" > m8-pre-restart-job.json
          docker compose exec -T postgres psql -U asgard -d heimdall -Atc \
            "SELECT status || '|' || COALESCE(result_ref::text,'') || '|' || attempt_count::text FROM analysis_jobs WHERE job_id='${JOB_ID}'::uuid;" \
            > m8-pre-restart-db.txt

      - name: Stop Kafka and prove broker unavailable
        shell: bash
        run: |
          set -euo pipefail
          docker compose stop kafka
          printf 'event=kafka-stop\n' > m8-kafka-restart-event.txt
          if docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1; then
            echo 'Kafka broker unexpectedly remained reachable after stop' >&2
            exit 1
          fi
          if docker ps --format '{{.Names}}' | grep -qx 'asgard-kafka'; then
            echo 'Kafka container still running after stop' >&2
            exit 1
          fi
          printf 'unavailableConfirmed=true\n' >> m8-kafka-restart-event.txt

      - name: Restart same Kafka broker and prove ready
        shell: bash
        run: |
          set -euo pipefail
          docker compose start kafka
          for attempt in {1..45}; do
            docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1 && break
            test "$attempt" -lt 45 || { docker compose logs kafka zookeeper; exit 1; }
            sleep 2
          done
          printf 'event=kafka-start\nreadyConfirmed=true\n' >> m8-kafka-restart-event.txt

      - name: Start Bifrost after Kafka restart and await persisted success
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn bifrost.api:app --host 0.0.0.0 --port 8000 > m8-bifrost.log 2>&1 & echo $! > m8-bifrost.pid
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && break
            test "$attempt" -lt 90 || { cat m8-bifrost.log; exit 1; }
            sleep 2
          done
          TOKEN=$(cat m8-token.txt)
          JOB_ID=$(cat m8-job-id.txt)
          for attempt in {1..180}; do
            curl --fail --silent -H "Authorization: Bearer $TOKEN" \
              "http://127.0.0.1:8080/api/v1/analysis/jobs/$JOB_ID" > m8-final-job.json
            STATUS=$(python -c "import json; print(json.load(open('m8-final-job.json'))['status'])")
            [ "$STATUS" = 'SUCCEEDED' ] && break
            [ "$STATUS" = 'FAILED' ] && { cat m8-final-job.json; exit 1; }
            sleep 2
          done
          LOG_ID=$(cat m8-log-id.txt)
          docker compose exec -T postgres psql -U asgard -d heimdall -Atc \
            "SELECT status || '|' || COALESCE(result_ref::text,'') || '|' || attempt_count::text FROM analysis_jobs WHERE job_id='${JOB_ID}'::uuid;" \
            > m8-final-db.txt
          docker compose exec -T postgres psql -U asgard -d heimdall -Atc \
            "SELECT count(*) FROM analysis_results WHERE log_id=${LOG_ID};" > m8-result-count.txt
          docker compose exec -T postgres psql -U asgard -d heimdall -Atc \
            "SELECT count(*) FROM redrive_audit_logs WHERE job_id='${JOB_ID}'::uuid;" > m8-audit-count.txt
          python - <<'PY'
          import json
          pre=json.load(open('m8-pre-restart-job.json'))
          final=json.load(open('m8-final-job.json'))
          pre_db=open('m8-pre-restart-db.txt').read().strip().split('|')
          final_db=open('m8-final-db.txt').read().strip().split('|')
          result_count=int(open('m8-result-count.txt').read().strip())
          audit_count=int(open('m8-audit-count.txt').read().strip())
          event=open('m8-kafka-restart-event.txt').read()
          assert final['status']=='SUCCEEDED', final
          assert final.get('resultRef') is not None, final
          assert final_db[0]=='SUCCEEDED' and final_db[1], final_db
          assert str(final.get('resultRef')) == final_db[1], (final, final_db)
          assert result_count == 1, result_count
          assert audit_count == 0, audit_count
          assert 'unavailableConfirmed=true' in event and 'readyConfirmed=true' in event, event
          evidence={
            'status':'PASS',
            'jobId':final.get('jobId') or final.get('id'),
            'preRestartStatus':pre.get('status'),
            'preRestartDb':{'status':pre_db[0],'resultRef':pre_db[1] or None,'attemptCount':int(pre_db[2])},
            'finalStatus':final.get('status'),
            'resultRef':final.get('resultRef'),
            'finalDb':{'status':final_db[0],'resultRef':final_db[1],'attemptCount':int(final_db[2])},
            'resultCountForTargetLog':result_count,
            'redriveAuditCount':audit_count,
            'kafkaUnavailableConfirmed':True,
            'sameBrokerRestartReadyConfirmed':True,
            'synthetic':True,
            'cloudExecution':False,
            'limitations':['single-node bounded Kafka stop/start proof only','no multi-broker/HA/failover claim','no recovery-time/SLA/SLO or production durability claim'],
          }
          json.dump(evidence, open('m8-evidence.json','w'), indent=2)
          PY
          grep -q 'Processing analysis request' m8-bifrost.log
          grep -q 'Analysis request processed successfully' m8-bifrost.log

      - name: Verify M8 evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          e=json.load(open('m8-evidence.json'))
          assert e['status']=='PASS'
          assert e['finalStatus']=='SUCCEEDED'
          assert e['resultRef'] is not None
          assert e['resultCountForTargetLog']==1
          assert e['redriveAuditCount']==0
          assert e['kafkaUnavailableConfirmed'] is True
          assert e['sameBrokerRestartReadyConfirmed'] is True
          assert e['synthetic'] is True and e['cloudExecution'] is False
          PY
          ! grep -R -E 'AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|Bearer [A-Za-z0-9._-]{20,}' \
            m8-evidence.json m8-kafka-restart-event.txt m8-pre-restart-db.txt m8-final-db.txt 2>/dev/null

      - name: Upload M8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-m8-kafka-restart-evidence
          if-no-files-found: warn
          path: |
            m8-evidence.json
            m8-pre-restart-job.json
            m8-final-job.json
            m8-pre-restart-db.txt
            m8-final-db.txt
            m8-result-count.txt
            m8-audit-count.txt
            m8-kafka-restart-event.txt
            m8-bifrost.log
            m8-heimdall.log

      - name: Cleanup proof environment
        if: always()
        shell: bash
        run: |
          set +e
          test -f m8-bifrost.pid && kill "$(cat m8-bifrost.pid)" 2>/dev/null || true
          test -f m8-heimdall.pid && kill "$(cat m8-heimdall.pid)" 2>/dev/null || true
          docker rm -f m8-ollama >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans >/dev/null 2>&1 || true
