name: v1.1 M5 Delivery Handoff

on:
  pull_request:
    paths:
      - 'docs/SINGLE_NODE_HANDOFF.md'
      - 'scripts/local-proof.sh'
      - 'scripts/m6-backup-restore-proof.sh'
      - '.github/workflows/v11-m1-local-proof.yml'
      - '.github/workflows/v11-m4-bifrost-restart.yml'
      - '.github/workflows/v11-m5-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate referenced handoff paths and proof syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/SINGLE_NODE_HANDOFF.md
          test -f scripts/local-proof.sh
          test -f scripts/m6-backup-restore-proof.sh
          test -f .github/workflows/v11-m1-local-proof.yml
          test -f .github/workflows/v11-m4-bifrost-restart.yml
          bash -n scripts/local-proof.sh
          bash -n scripts/m6-backup-restore-proof.sh

      - name: Validate bounded handoff contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/SINGLE_NODE_HANDOFF.md').read_text()
          required = [
              'bash scripts/local-proof.sh',
              'ASGARD_PROOF_KEEP=1',
              '.github/workflows/v11-m1-local-proof.yml',
              '.github/workflows/v11-m4-bifrost-restart.yml',
              'scripts/m6-backup-restore-proof.sh',
              'Java 21',
              'Docker Compose plugin',
              'Local-first',
          ]
          missing = [item for item in required if item not in text]
          assert not missing, f'missing handoff contract items: {missing}'
          assert 'Backup/restore: NOT VERIFIED' not in text, 'obsolete backup/restore non-claim remains'
          print('M5 handoff contract PASS against current accepted handoff truth')
          PY

  real-local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute accepted Local-first handoff path
        shell: bash
        env:
          ASGARD_PROOF_OUTPUT: ${{ github.workspace }}/v11-m5-local-proof-summary.json
          ASGARD_PROOF_EVIDENCE_DIR: ${{ github.workspace }}/m5-local-proof-evidence
        run: bash scripts/local-proof.sh
      - name: Verify handoff result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('v11-m5-local-proof-summary.json').read_text())
          assert data['status'] == 'PASS', data
          assert data['provider'] == 'ollama', data
          assert data['synthetic'] is True, data
          assert data['cloudExecution'] is False, data
          print('M5 real Local-first handoff PASS')
          PY
      - name: Upload handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-m5-handoff-evidence
          path: |
            v11-m5-local-proof-summary.json
            m5-local-proof-evidence/
          if-no-files-found: warn
          retention-days: 14
