name: P1-B1 Real Local AI Golden Path

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/p1-b1-local-ai.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - 'scripts/**'
      - 'heimdall/**'
      - 'bifrost/**'
      - 'docker-compose.yml'
  workflow_dispatch: {}

jobs:
  uc02_real_local_ai:
    name: UC-02 real Local AI golden path
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Prepare Heimdall and Bifrost
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :heimdall:bootJar --no-daemon --console=plain
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r bifrost/requirements.txt
          python -m pip install -e bifrost

      - name: Start infrastructure
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres zookeeper kafka redis elasticsearch

          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U asgard >/dev/null 2>&1; then
              echo "PostgreSQL ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..45}; do
            if docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1; then
              echo "Kafka ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose logs kafka zookeeper
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9200/_cluster/health > p1-b1-elasticsearch.json; then
              echo "Elasticsearch ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs elasticsearch
              exit 1
            fi
            sleep 2
          done

      - name: Start real Ollama model
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name p1-b1-ollama -p 11434:11434 ollama/ollama:latest

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > p1-b1-ollama-tags-before.json; then
              echo "Ollama ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs p1-b1-ollama
              exit 1
            fi
            sleep 2
          done

          docker exec p1-b1-ollama ollama pull smollm:135m | tee p1-b1-ollama-pull.log
          curl --fail --silent http://127.0.0.1:11434/api/tags > p1-b1-ollama-tags-after.json
          grep -q 'smollm:135m' p1-b1-ollama-tags-after.json

      - name: Start Heimdall and Bifrost integration
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/heimdall
          SPRING_DATASOURCE_USERNAME: asgard
          SPRING_DATASOURCE_PASSWORD: asgard_password
          SPRING_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          JWT_SECRET: p1-b1-ci-jwt-secret-at-least-32-bytes-long
          HEIMDALL_SECURITY_ADMIN_USERNAME: admin
          HEIMDALL_SECURITY_ADMIN_PASSWORD: p1-b1-admin-password
          HEIMDALL_SECURITY_ADMIN_ROLES: ADMIN,USER
          # UC-02 creates the target Job explicitly. Disable ingestion auto-request
          # only in this proof process so one long local inference cannot starve it.
          HEIMDALL_ANALYSIS_AUTO_REQUEST: 'false'
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: redis_password
          GRPC_PORT: '9091'
          KAFKA_ENABLED: 'true'
          HEIMDALL_ENABLED: 'true'
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          HEIMDALL_DATABASE_URL: postgresql://asgard:asgard_password@127.0.0.1:5432/heimdall
          BIFROST_OLLAMA_URL: http://127.0.0.1:11434
          BIFROST_OLLAMA_MODEL: smollm:135m
          BIFROST_OLLAMA_ALLOW_FALLBACK: 'false'
        run: |
          set -euo pipefail
          HEIMDALL_JAR=$(find heimdall/build/libs -maxdepth 1 -name 'heimdall-*.jar' -type f | head -n 1)
          test -n "$HEIMDALL_JAR"

          java -jar "$HEIMDALL_JAR" > p1-b1-heimdall.log 2>&1 &
          echo $! > p1-b1-heimdall.pid

          python -m bifrost.main serve > p1-b1-bifrost.log 2>&1 &
          echo $! > p1-b1-bifrost.pid

          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > p1-b1-heimdall-health.json; then
              echo "Heimdall ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              cat p1-b1-heimdall.log
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health > p1-b1-bifrost-health.json; then
              echo "Bifrost ready on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat p1-b1-bifrost.log
              exit 1
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          with open('p1-b1-bifrost-health.json', encoding='utf-8') as f:
              health = json.load(f)
          assert health['components']['ollama'] == 'ok', health
          assert health['components']['kafka'] == 'enabled', health
          assert health['components']['heimdall_integration'] == 'enabled', health
          PY

      - name: Execute deterministic UC-02 flow
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"p1-b1-admin-password"}' \
            http://127.0.0.1:8080/api/v1/auth/login > p1-b1-login.json

          TOKEN=$(python - <<'PY'
          import json
          print(json.load(open('p1-b1-login.json'))['token'])
          PY
          )
          test -n "$TOKEN"

          cat > p1-b1-input.json <<'JSON'
          {
            "source": "p1-b1-ci",
            "serviceName": "payment-service",
            "environment": "proof",
            "severity": "ERROR",
            "logContent": "2026-08-20T01:00:00Z ERROR payment-service upstream gateway timeout after 3000ms transaction=p1-b1-deterministic",
            "metadata": {"proof": "uc-02", "deterministic": true}
          }
          JSON

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data @p1-b1-input.json \
            http://127.0.0.1:8080/api/v1/logs > p1-b1-ingest.json

          LOG_ID=$(python - <<'PY'
          import json
          print(json.load(open('p1-b1-ingest.json'))['logId'])
          PY
          )
          test -n "$LOG_ID"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: p1-b1-real-local-ai-v1' \
            -d '{"idempotencyKey":"p1-b1-real-local-ai-v1","modelPolicy":{"source":"local"}}' \
            -X POST http://127.0.0.1:8080/api/v1/logs/$LOG_ID/analysis > p1-b1-analysis-accepted.json

          JOB_ID=$(python - <<'PY'
          import json
          print(json.load(open('p1-b1-analysis-accepted.json'))['jobId'])
          PY
          )
          test -n "$JOB_ID"
          echo "$JOB_ID" | tee p1-b1-job-id.txt

          final_status=''
          # Hosted CPU Ollama latency is variable. This is a tolerance window,
          # not a performance/SLA claim. Keep the job-level workflow timeout bounded.
          for attempt in {1..180}; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $TOKEN" \
              http://127.0.0.1:8080/api/v1/analysis/jobs/$JOB_ID > p1-b1-job.json
            final_status=$(python - <<'PY'
          import json
          print(json.load(open('p1-b1-job.json'))['status'])
          PY
            )
            echo "Job status attempt $attempt: $final_status"
            if [ "$final_status" = 'SUCCEEDED' ]; then
              break
            fi
            if [ "$final_status" = 'FAILED' ]; then
              cat p1-b1-job.json
              exit 1
            fi
            sleep 2
          done
          test "$final_status" = 'SUCCEEDED'

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8080/api/v1/logs/$LOG_ID/analysis > p1-b1-result.json

          python - <<'PY'
          import json
          job = json.load(open('p1-b1-job.json'))
          result = json.load(open('p1-b1-result.json'))
          assert job['status'] == 'SUCCEEDED', job
          assert result.get('analysisId') is not None, result
          model = result.get('model') or ''
          assert 'smollm' in model.lower(), result
          assert model.lower() != 'fallback', result
          assert (result.get('summary') or '').strip(), result
          print('UC-02 evidence:', json.dumps({
              'jobId': job['jobId'],
              'status': job['status'],
              'logId': job['logId'],
              'model': model,
              'analysisId': result['analysisId'],
          }, ensure_ascii=False))
          PY

          grep -q 'Processing analysis request from Heimdall' p1-b1-bifrost.log
          grep -q "$JOB_ID" p1-b1-bifrost.log

      - name: Capture Kafka handoff evidence
        if: always()
        shell: bash
        run: |
          set +e
          docker compose exec -T kafka kafka-console-consumer \
            --bootstrap-server kafka:29092 \
            --topic analysis.request \
            --from-beginning \
            --timeout-ms 5000 \
            --max-messages 5 > p1-b1-kafka-request.txt 2>&1
          docker compose exec -T kafka kafka-console-consumer \
            --bootstrap-server kafka:29092 \
            --topic analysis.result \
            --from-beginning \
            --timeout-ms 5000 \
            --max-messages 5 > p1-b1-kafka-result.txt 2>&1

      - name: Upload UC-02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-b1-real-local-ai-evidence
          path: |
            p1-b1-input.json
            p1-b1-ingest.json
            p1-b1-analysis-accepted.json
            p1-b1-job-id.txt
            p1-b1-job.json
            p1-b1-result.json
            p1-b1-ollama-pull.log
            p1-b1-ollama-tags-after.json
            p1-b1-heimdall-health.json
            p1-b1-bifrost-health.json
            p1-b1-kafka-request.txt
            p1-b1-kafka-result.txt
            p1-b1-heimdall.log
            p1-b1-bifrost.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f p1-b1-heimdall.pid ]; then kill "$(cat p1-b1-heimdall.pid)" 2>/dev/null || true; fi
          if [ -f p1-b1-bifrost.pid ]; then kill "$(cat p1-b1-bifrost.pid)" 2>/dev/null || true; fi
          docker rm -f p1-b1-ollama >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans >/dev/null 2>&1 || true
